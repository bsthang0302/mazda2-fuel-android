name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for easy download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mazda2-NhatKyDoXang.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mazda2-NhatKyDoXang-APK
          path: Mazda2-NhatKyDoXang.apk

      - name: Publish APK to GitHub Releases (Direct Download Link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Nhật Ký Đổ Xăng Android (Build #${{ github.run_number }})"
          body: |
            ### 📲 Tải file cài đặt trực tiếp cho điện thoại Android
            Nhấn vào file **`Mazda2-NhatKyDoXang.apk`** bên dưới mục **Assets** để tải về điện thoại và cài đặt ngay (không cần giải nén).
          files: Mazda2-NhatKyDoXang.apk
          prerelease: false
